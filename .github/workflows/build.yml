name: Build and Publish

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    uses: mikopbx/.github-workflows/.github/workflows/extension-publish.yml@master
    with:
      initial_version: "1.70"
      custom_build_steps: |
        cd $GITHUB_WORKSPACE/module
        
        # Set up Docker cache
        DOCKER_IMAGE_TAG="tg2sip-build-env:2.1"
        DOCKER_CACHE_FILE="$RUNNER_TEMP/docker-cache.tar"
        
        # Try to load cached image
        echo "Loading Docker cache from $DOCKER_CACHE_FILE..."
        if [ -f "$DOCKER_CACHE_FILE" ]; then
          docker load < "$DOCKER_CACHE_FILE"
          echo "Docker cache loaded"
        fi
        
        # Check if image exists
        if ! docker images $DOCKER_IMAGE_TAG --format "{{.Repository}}:{{.Tag}}" | grep -q "^$DOCKER_IMAGE_TAG$"; then
          echo "Cache miss or invalid. Building Docker environment..."
          docker build -t $DOCKER_IMAGE_TAG -f src/td-keyboard/build-env/Dockerfile .
        
          # Save to cache
          echo "Saving Docker image to cache..."
          docker save $DOCKER_IMAGE_TAG > "$DOCKER_CACHE_FILE"
        else
          echo "Using cached Docker image: $DOCKER_IMAGE_TAG"
        fi
                

    secrets: inherit