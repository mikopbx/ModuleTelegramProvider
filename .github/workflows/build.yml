name: Build and Publish

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    uses: mikopbx/.github-workflows/.github/workflows/extension-publish.yml@master
    with:
      initial_version: "1.70"
      custom_build_steps: |
        cd $GITHUB_WORKSPACE/module
        
        # Set up Docker cache
        DOCKER_IMAGE_TAG="tg2sip-build-env:2.1"
        
        # Cache handling function
        handle_docker_cache() {
          local image_name=$1
          local dockerfile_path=$2
          local cache_file="$RUNNER_TEMP/docker-cache-${image_name// /_}.tar"
        
          # Try to restore from cache
          if [ -f "$cache_file" ]; then
            echo "Loading cached image: $image_name"
            docker load < "$cache_file"
          fi
        
          # Build if not exists
          if ! docker images $image_name | grep -q "${image_name}"; then
            echo "Building image: $image_name from $dockerfile_path"
            docker build -t $image_name -f "$dockerfile_path" .
            # Save to cache
            echo "Caching image: $image_name"
            docker save $image_name > "$cache_file"
          else
            echo "Using cached image: $image_name"
          fi
        }
        
        # Prepare build environments
        handle_docker_cache "$DOCKER_IMAGE_TAG" "td-keyboard/build-env/Dockerfile"
        

    secrets: inherit